<html>

<head>
    <style>
        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        canvas {
            width: 100%;
            height: 100%;
        }

        #panel {
            position: absolute;
            top: 12px;
            left: 12px;
            background: rgba(0, 0, 0, 0.75);
            color: white;
            font-family: sans-serif;
            font-size: 14px;
            padding: 12px;
        }

        #panel label {
            display: block;
            margin: 6px 0;
        }

        #panel button {
            margin: 8px 6px 0 0;
        }
    </style>

    <script src="https://cdn.babylonjs.com/babylon.js"></script>
    <script src="https://cdn.babylonjs.com/loaders/babylon.glTF2FileLoader.min.js"></script>
</head>

<body>
    <canvas id="canvas"></canvas>

    <div id="panel">
        <div>PBR material</div>

        <label>Metallic <input id="metallic" type="range" min="0" max="1" step="0.01" value="0"></label>
        <label>Roughness <input id="roughness" type="range" min="0" max="1" step="0.01" value="0.5"></label>
        <label>Albedo <input id="albedo" type="color" value="#cccccc"></label>
        <label>Emissive <input id="emissive" type="color" value="#000000"></label>
        <label>Emissive intensity <input id="emissiveIntensity" type="range" min="0" max="3" step="0.01" value="0"></label>

        <button id="metal">Metal</button>
        <button id="plastic">Plastic</button>
        <button id="gold">Gold</button>
        <button id="neon">Neon</button>
    </div>

    <script type="module">
        let canvas = document.getElementById("canvas");

        let engine = new BABYLON.WebGPUEngine(canvas, { antialiasing: true });
        await engine.initAsync();

        const scene = new BABYLON.Scene(engine);

        await BABYLON.SceneLoader.AppendAsync('', 'poly.glb', scene);

        // one PBR material for the loaded PolyCam mesh
        let pbr = new BABYLON.PBRMaterial("pbr", scene);
        pbr.metallic = 0;
        pbr.roughness = 0.5;
        pbr.albedoColor = new BABYLON.Color3(0.8, 0.8, 0.8);
        pbr.emissiveColor = new BABYLON.Color3(0, 0, 0);
        pbr.emissiveIntensity = 0;

        for (let i = 0; i < scene.meshes.length; i++) {
            let mesh = scene.meshes[i];

            if (mesh.getTotalVertices() > 0) {
                mesh.material = pbr;
            }
        }

        scene.createDefaultCameraOrLight(true, true, true);
        scene.activeCamera.attachControl(canvas, true);

        // one extra light so metal and roughness are easy to see
        let dir = new BABYLON.DirectionalLight("dir", new BABYLON.Vector3(-1, -2, -1), scene);
        dir.intensity = 1.5;

        function hexToColor3(hex) {
            let r = parseInt(hex.slice(1, 3), 16) / 255;
            let g = parseInt(hex.slice(3, 5), 16) / 255;
            let b = parseInt(hex.slice(5, 7), 16) / 255;

            return new BABYLON.Color3(r, g, b);
        }

        function setControls(metallic, roughness, albedo, emissive, emissiveIntensity) {
            document.getElementById("metallic").value = metallic;
            document.getElementById("roughness").value = roughness;
            document.getElementById("albedo").value = albedo;
            document.getElementById("emissive").value = emissive;
            document.getElementById("emissiveIntensity").value = emissiveIntensity;
        }

        function readControls() {
            pbr.metallic = parseFloat(document.getElementById("metallic").value);
            pbr.roughness = parseFloat(document.getElementById("roughness").value);
            pbr.albedoColor = hexToColor3(document.getElementById("albedo").value);
            pbr.emissiveColor = hexToColor3(document.getElementById("emissive").value);
            pbr.emissiveIntensity = parseFloat(document.getElementById("emissiveIntensity").value);
        }

        function applyPreset(metallic, roughness, albedo, emissive, emissiveIntensity) {
            setControls(metallic, roughness, albedo, emissive, emissiveIntensity);
            readControls();
        }

        document.getElementById("metallic").oninput = readControls;
        document.getElementById("roughness").oninput = readControls;
        document.getElementById("albedo").oninput = readControls;
        document.getElementById("emissive").oninput = readControls;
        document.getElementById("emissiveIntensity").oninput = readControls;

        document.getElementById("metal").onclick = function () {
            applyPreset(1, 0.15, "#c0c0c0", "#000000", 0);
        };

        document.getElementById("plastic").onclick = function () {
            applyPreset(0, 0.45, "#e23b3b", "#000000", 0);
        };

        document.getElementById("gold").onclick = function () {
            applyPreset(1, 0.2, "#ffd700", "#000000", 0);
        };

        document.getElementById("neon").onclick = function () {
            applyPreset(0, 0.4, "#111111", "#39ff14", 2);
        };

        engine.runRenderLoop(() => scene.render());
        addEventListener('resize', () => engine.resize());
    </script>
</body>

</html>
